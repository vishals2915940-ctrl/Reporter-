services:
  - type: web
    name: tg-reporter
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tg-reporter-db
          property: connectionString

databases:
  - name: tg-reporter-db
    region: oregon
    plan: free
